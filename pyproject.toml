[project]
name = "capstone2-tourism-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
